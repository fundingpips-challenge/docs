<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 800" role="img" font-family="Inter, Segoe UI, Arial, sans-serif">
<title>Platform architecture</title><desc>GitHub Actions and Flux apply Terraform and deploy the app into a single AWS account holding dev, staging and production VPCs; production is shown in full detail with public, private app and private data subnets, alongside shared Secrets Manager, ECR and S3.</desc>
<rect width="860" height="800" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="30" y="28" font-size="21" font-weight="600" fill="#242422">Platform architecture</text>
<text x="30" y="50" font-size="13" font-weight="400" fill="#5F5E5A">Single AWS account, VPC-level isolation across dev, staging and production</text>
<line x1="30" y1="58" x2="830" y2="58" stroke="#D3D1C7" stroke-width="1"/>
<g transform="translate(0,66)">
