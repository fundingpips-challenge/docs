<rect x="534" y="436" width="110" height="44" rx="8" fill="#ffffff" stroke="#993C1D" stroke-width="0.5"/>
<text x="589.0" y="449.0" font-size="12" font-weight="600" fill="#712B13" text-anchor="middle" dominant-baseline="central">Aurora</text>
<text x="589.0" y="467.0" font-size="10" font-weight="400" fill="#993C1D" text-anchor="middle" dominant-baseline="central">writer + readers</text>
